[project]
name = "bonk7"
authors = [{ name = "Bonk & Co Ltd", email = "reagan@bonkandco.com" }]
description = "Bonk7: Bonk & Co branding and Cin7-style layout for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
